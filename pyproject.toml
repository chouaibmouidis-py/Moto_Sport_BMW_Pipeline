[project]
name = "moto-sport-bmw-pipeline"
version = "0.1.0"
description = "Educational IMSA extraction pipeline focused on BMW race entries"
readme = "README.md"
authors = [
    { name = "MOUID", email = "chouaibmouidis@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.5.4",
    "requests>=2.34.2",
]

[project.scripts]
moto-sport-bmw-pipeline = "moto_sport_bmw_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
