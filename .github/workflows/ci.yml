# Validate code changes without downloading race reports or publishing data.
name: Pipeline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: false

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --python 3.12

      - name: Check whitespace errors
        run: git show --format= --check HEAD

      - name: Run unit and local integration tests
        run: uv run --locked --no-sync python -m unittest discover -s tests -v

      - name: Check package entry points
        run: |
          uv run --locked --no-sync moto-sport-bmw-pipeline --help
          uv run --locked --no-sync python -m moto_sport_bmw_pipeline --help

      - name: Validate manifest identifiers
        run: |
          uv run --locked --no-sync python - <<'PY'
          import json
          from pathlib import Path
          from moto_sport_bmw_pipeline.manifest import validate_unique_source_ids

          manifest = json.loads(Path("config/sources.json").read_text(encoding="utf-8"))
          validate_unique_source_ids(manifest["documents"])
          PY
