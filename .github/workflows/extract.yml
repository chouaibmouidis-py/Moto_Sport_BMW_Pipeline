name: Validate and extract IMSA source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: false

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --python 3.12

      - name: Test download failure handling without network access
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Download and validate the historical source
        run: uv run --locked python download.py

      - name: Inspect the downloaded source
        run: uv run --locked python inspect_source.py
