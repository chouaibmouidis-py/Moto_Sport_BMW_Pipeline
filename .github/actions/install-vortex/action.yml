name: Install the DuckDB Vortex extension
description: Install and load Vortex for the locked interpreter before tests or pipeline execution
runs:
  using: composite
  steps:
    - name: Install and verify Vortex
      shell: bash
      run: |
        uv run --locked --no-sync python - <<'PY'
        import os
        from pathlib import Path
        import duckdb

        with duckdb.connect() as connection:
            connection.execute("INSTALL vortex")
            connection.execute("LOAD vortex")
            install_path, version = connection.execute(
                "SELECT install_path, extension_version FROM duckdb_extensions() WHERE extension_name = 'vortex'"
            ).fetchone()
        # DuckDB stores extensions under root/version/platform/extension_file.
        directory = Path(install_path).parents[2]
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as file:
            file.write(f"BMW_VORTEX_EXTENSION_DIRECTORY={directory}\n")
        print(f"Verified Vortex {version}; extension root: {directory}")
        PY
